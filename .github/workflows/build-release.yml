name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name FundAnalyzer --collect-all akshare main.py

      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path "dist/FundAnalyzer/*" -DestinationPath "dist/FundAnalyzer-Windows.zip"

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/FundAnalyzer-Windows.zip" --title "$env:GITHUB_REF_NAME" --generate-notes
